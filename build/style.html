<style>
@page { size: A4; margin: 16mm 15mm 16mm 15mm; }
html { font-size: 10.5pt; }
body {
  font-family: "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
  line-height: 1.6;
  color: #222;
  max-width: none;
  margin: 0;
  padding: 0;
}
header#title-block-header { text-align: center; margin: 8mm 0 6mm; }
h1.title { font-size: 24pt; border: none; margin-bottom: 4mm; }
p.subtitle { font-size: 13pt; color: #555; }
nav#TOC { font-size: 10pt; margin-bottom: 6mm; }
nav#TOC ul { list-style: none; padding-left: 1.2em; margin: 0; }
nav#TOC > ul { padding-left: 0; }
nav#TOC > ul > li { margin-top: 0.5em; font-weight: bold; }
nav#TOC > ul > li li { font-weight: normal; }
nav#TOC a { color: #222; text-decoration: none; }
h1 { font-size: 18pt; color: #0b3d91; border-bottom: 2px solid #0b3d91; padding-bottom: 2mm; page-break-before: always; margin-top: 0; }
h2 { font-size: 14pt; color: #fff; background: #0b3d91; padding: 1.5mm 3mm; border-radius: 2px; margin-top: 7mm; page-break-after: avoid; }
h3 { font-size: 11.5pt; color: #0b3d91; border-left: 4px solid #e8a33d; padding-left: 2.5mm; margin: 5mm 0 2mm; page-break-after: avoid; break-after: avoid; }
p, li { margin: 0.25em 0; }
ul, ol { padding-left: 1.4em; margin: 0.2em 0; }
strong { color: #8b1a1a; }
p > strong:only-child { color: #0b3d91; }
code { font-family: "Noto Sans Mono CJK SC", "WenQuanYi Micro Hei Mono", "DejaVu Sans Mono", monospace; font-size: 0.9em; background: #f3f3f3; padding: 0 2px; border-radius: 2px; }
pre {
  background: #f6f8fa;
  border: 1px solid #ddd;
  padding: 2mm 3mm;
  font-size: 8pt;
  line-height: 1.35;
  white-space: pre;
  word-break: normal;
  overflow-wrap: normal;
  page-break-inside: auto;
}
pre code { background: none; padding: 0; white-space: pre; }
table { border-collapse: collapse; width: 100%; margin: 2mm 0; font-size: 9.3pt; page-break-inside: avoid; }
th, td { border: 1px solid #bbb; padding: 1mm 2mm; vertical-align: top; }
th { background: #e9eef7; }
blockquote { border-left: 4px solid #ccc; margin: 2mm 0; padding: 1mm 3mm; color: #555; background: #fafafa; }
a { color: #0b3d91; }
</style>
