site_name: 面试八股笔记
site_description: Redis、MySQL、Go 秒杀、AI Agent、手搓 Pi Agent、Java、Go、操作系统、计算机网络
site_url: https://losaveroad.github.io/interview-prep/
repo_url: https://github.com/LosAveRoad/interview-prep
repo_name: LosAveRoad/interview-prep
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

hooks:
  - hooks/pdf_link.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 6
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - Redis: redis.md
  - MySQL: mysql.md
  - Go 秒杀: seckill.md
  - AI Agent: agent.md
  - 手搓 Pi Agent:
      - 总览与里程碑: pi-agent/index.md
      - Agent Core: pi-agent/core.md
      - 上下文压缩与中断恢复: pi-agent/compaction-resume.md
      - 记忆与 Skill: pi-agent/memory-skill.md
      - Git 与仓库工具: pi-agent/git.md
      - MCP: pi-agent/mcp.md
      - 网关与适配层: pi-agent/gateway.md
      - TUI: pi-agent/tui.md
  - Java: java.md
  - Go: go.md
  - 操作系统: os.md
  - 计算机网络: network.md
