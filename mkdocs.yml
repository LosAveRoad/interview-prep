site_name: 面试八股笔记
site_description: Redis / MySQL、AI Agent、Java / Go、计算机组成原理
site_url: https://losaveroad.github.io/interview-prep/
repo_url: https://github.com/LosAveRoad/interview-prep
repo_name: LosAveRoad/interview-prep
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

hooks:
  - hooks/pdf_link.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - Redis & MySQL: redis-mysql.md
  - AI Agent: agent.md
  - Java & Go: java-go.md
  - 计算机组成原理: computer-organization.md
